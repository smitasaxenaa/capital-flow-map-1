name: Daily Capital Flow Map

on:
  schedule:
    # 11:30 UTC = 17:00 IST, about 90 min after NSE closes. Weekdays only.
    - cron: "30 11 * * 1-5"
  workflow_dispatch:        # adds a "Run workflow" button so you can trigger it by hand

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: flowmap
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build flow maps
        run: |
          for W in 1W 1M 3M; do
            python capital_flow.py --window $W --outdir output/$W --nav 1W,1M,3M
          done
          # Root page just bounces to the 1-month view
          printf '<!doctype html><meta charset=utf-8><meta http-equiv=refresh content="0;url=./1M/">' > output/index.html
          touch output/.nojekyll

      - name: Save history
        run: |
          git config user.name  "flow-bot"
          git config user.email "flow-bot@users.noreply.github.com"
          git add -f output/*/history.csv
          git diff --staged --quiet || git commit -m "flow map $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
